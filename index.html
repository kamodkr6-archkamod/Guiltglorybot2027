<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAIM — Premium Squad Dashboard</title>
<style>
    :root {
        --bg-color: #12131c;
        --panel-bg: #1c1d29;
        --card-bg: #232536;
        --inner-bg: #1a1b23;
        --border-color: #2d3047;
        --text-main: #ffffff;
        --text-muted: #8b8da3;
        --accent-purple: #7b66ff;
        --accent-green: #22c55e;
        --accent-red: #ef4444;
        --accent-gold: #eab308;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; padding: 20px 15px; min-height: 100vh; }

    .container { width: 100%; max-width: 750px; }

    /* ══ HEADER ══ */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 5px; }
    .brand { display: flex; align-items: center; gap: 15px; }
    .logo { width: 48px; height: 48px; background: linear-gradient(135deg, #6e56ff, #5b43e6); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; color: white; box-shadow: 0 4px 15px rgba(110, 86, 255, 0.3); }
    .brand-text h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: 0.5px; }
    .brand-text p { font-size: 0.65rem; color: var(--text-muted); letter-spacing: 1px; margin-top: 3px; text-transform: uppercase; font-weight: 600; }
    .status-pill { background: rgba(34, 197, 94, 0.1); color: var(--accent-green); padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; display: flex; align-items: center; gap: 6px; border: 1px solid rgba(34, 197, 94, 0.2); }
    .dot { width: 6px; height: 6px; background: var(--accent-green); border-radius: 50%; box-shadow: 0 0 8px var(--accent-green); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

    /* ══ STATS ══ */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
    .stat-box { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; text-align: center; }
    .stat-box .title { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 5px; }
    .stat-box .value { font-size: 1.1rem; font-weight: 800; }
    .val-green { color: var(--accent-green); }
    .val-purple { color: var(--accent-purple); }
    .val-gold { color: var(--accent-gold); }

    /* ══ PANELS ══ */
    .panel { background: var(--panel-bg); border-radius: 20px; padding: 24px; border: 1px solid var(--border-color); margin-bottom: 20px; }
    .section-title { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); letter-spacing: 1.5px; margin-bottom: 20px; text-transform: uppercase; }
    .section-title::before { content: ''; width: 4px; height: 16px; background: var(--accent-purple); border-radius: 2px; }

    /* ══ SQUAD LAUNCHER ══ */
    .squad-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; margin-bottom: 15px; }
    .squad-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .squad-title { display: flex; align-items: center; gap: 12px; font-size: 1.05rem; font-weight: 700; }
    .squad-badge { background: #7b66ff; color: white; width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
    .btn-remove { background: transparent; border: 1px solid #333; color: var(--text-muted); padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; transition: 0.2s; }
    .btn-remove:hover { color: var(--accent-red); border-color: var(--accent-red); }

    /* INPUTS */
    .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
    input, select { background: var(--inner-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px 14px; border-radius: 10px; font-size: 0.85rem; outline: none; width: 100%; transition: 0.2s; }
    input:focus, select:focus { border-color: var(--accent-purple); }
    input::placeholder { color: #55576b; }
    .btn-save { background: #292b3d; color: var(--text-main); border: none; padding: 0 20px; border-radius: 10px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.2s; white-space: nowrap; }
    .btn-save:hover { background: #343750; }

    /* SLOTS */
    .slot-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .slot-label { width: 55px; font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }
    .slot-inputs { display: flex; gap: 10px; flex: 1; }

    /* BUTTONS */
    .btn-add-squad { background: transparent; border: 1px dashed var(--border-color); color: var(--text-muted); padding: 16px; border-radius: 14px; font-size: 0.9rem; font-weight: 600; width: 100%; margin-bottom: 15px; cursor: pointer; transition: 0.2s; }
    .btn-add-squad:hover { border-color: var(--accent-purple); color: var(--accent-purple); background: rgba(123, 102, 255, 0.05); }
    .btn-launch { background: linear-gradient(90deg, #6e56ff, #7b66ff); color: white; border: none; padding: 16px; border-radius: 14px; font-size: 1rem; font-weight: 700; width: 100%; cursor: pointer; box-shadow: 0 4px 15px rgba(110, 86, 255, 0.3); transition: 0.2s; }
    .btn-launch:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(110, 86, 255, 0.5); }

    /* ══ ACTIVE ACCOUNTS ══ */
    .acc-list { display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto; padding-right: 5px; }
    .acc-item { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 16px; }
    .acc-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .acc-info h4 { font-size: 0.95rem; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    .acc-info p { font-size: 0.75rem; color: var(--text-muted); }
    .badge { padding: 4px 10px; border-radius: 6px; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.5px; }
    .b-green { background: rgba(34, 197, 94, 0.15); color: var(--accent-green); border: 1px solid rgba(34, 197, 94, 0.3); }
    .b-yellow { background: rgba(234, 179, 8, 0.15); color: var(--accent-gold); border: 1px solid rgba(234, 179, 8, 0.3); }
    .b-red { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3); }
    .acc-progress { height: 6px; background: #111; border-radius: 3px; margin: 12px 0 6px 0; overflow: hidden; }
    .acc-progress-bar { height: 100%; background: linear-gradient(90deg, #22c55e, #eab308); border-radius: 3px; transition: width 0.3s; }
    .acc-exp-text { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted); font-weight: 600; margin-bottom: 14px; }
    .acc-actions { display: flex; gap: 8px; }
    .btn-sm { flex: 1; padding: 8px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; border: none; cursor: pointer; transition: 0.2s; text-align: center; }
    .btn-pause { background: rgba(234, 179, 8, 0.15); color: var(--accent-gold); border: 1px solid rgba(234, 179, 8, 0.3); }
    .btn-pause:hover { background: rgba(234, 179, 8, 0.25); }
    .btn-resume { background: rgba(34, 197, 94, 0.15); color: var(--accent-green); border: 1px solid rgba(34, 197, 94, 0.3); }
    .btn-resume:hover { background: rgba(34, 197, 94, 0.25); }
    .btn-del { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3); }
    .btn-del:hover { background: rgba(239, 68, 68, 0.25); }

    /* ══ LOGS ══ */
    .logs-box { background: #0a0b10; padding: 15px; border-radius: 12px; height: 250px; overflow-y: auto; font-family: 'Consolas', monospace; font-size: 0.75rem; line-height: 1.6; border: 1px solid var(--border-color); }
    .log-line { margin-bottom: 4px; word-break: break-all; }
    .log-time { color: #555; margin-right: 8px; }
    .log-info { color: #00d4ff; }
    .log-success { color: var(--accent-green); }
    .log-error { color: var(--accent-red); }
    .log-warning { color: var(--accent-gold); }

    /* ══ GUILD INFO ══ */
    .guild-result { margin-top: 15px; padding: 16px; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); display: none; }
    .guild-result.active { display: block; }
    .g-row { display: flex; justify-content: space-between; font-size: 0.8rem; padding: 8px 0; border-bottom: 1px dashed #2d3047; }
    .g-row:last-child { border-bottom: none; }
    .g-row .k { color: var(--text-muted); font-weight: 600; }
    .g-row .v { font-weight: 700; color: var(--text-main); }
    .g-val-green { color: var(--accent-green); }

    /* Toast */
    #toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; }
    .toast { background: var(--card-bg); padding: 14px 20px; border-radius: 10px; border-left: 4px solid var(--accent-purple); box-shadow: 0 4px 15px rgba(0,0,0,0.5); animation: slideIn 0.3s ease; font-size: 0.85rem; font-weight: 600; }
    .toast.error { border-color: var(--accent-red); }
    .toast.success { border-color: var(--accent-green); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
</style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <div class="header">
        <div class="brand">
            <div class="logo">R</div>
            <div class="brand-text">
                <h1>NAIM Bot</h1>
                <p>Battle Royale · Multi-Squad</p>
            </div>
        </div>
        <div class="status-pill">
            <div class="dot"></div> Online
        </div>
    </div>

    <!-- STATS -->
    <div class="stats-grid">
        <div class="stat-box"><div class="title">Accounts</div><div class="value val-purple" id="stat-acc">0</div></div>
        <div class="stat-box"><div class="title">Matches</div><div class="value val-gold" id="stat-match">0</div></div>
        <div class="stat-box"><div class="title">Live EXP</div><div class="value val-green" id="stat-exp">0</div></div>
        <div class="stat-box"><div class="title">EXP/Hour</div><div class="value" id="stat-exph">0</div></div>
    </div>

    <!-- SQUAD LAUNCHER -->
    <div class="panel">
        <div class="section-title">Launch Squad</div>
        <div id="squads-container"></div>
        <button class="btn-add-squad" onclick="addSquad()">+ Add another squad</button>
        <button class="btn-launch" onclick="launchAll()">Launch All Squads</button>
    </div>

    <!-- ACTIVE BOTS -->
    <div class="panel">
        <div class="section-title">Active Bots <span id="acc-count" style="color:var(--text-main); margin-left:5px;">(0)</span></div>
        <div class="acc-list" id="acc-list">
            <div style="text-align:center; color:var(--text-muted); font-size:0.85rem; padding:20px;">No accounts running yet.</div>
        </div>
    </div>

    <!-- GUILD TRACKER -->
    <div class="panel">
        <div class="section-title">Live Guild Track</div>
        <div class="input-group" style="margin-bottom:0;">
            <input type="text" id="guildId" placeholder="Enter Guild ID (Clan ID)">
            <select id="guildRegion">
                <option value="BD">🇧🇩 BD</option>
                <option value="IND">🇮🇳 IND</option>
                <option value="ME">🌍 ME</option>
            </select>
            <button class="btn-save" onclick="fetchGuild()">Track</button>
        </div>
        <div class="guild-result" id="guildResult">
            <div class="g-row"><span class="k">Guild Name</span><span class="v" id="g-name">-</span></div>
            <div class="g-row"><span class="k">Clan ID</span><span class="v" id="g-id">-</span></div>
            <div class="g-row"><span class="k">Level</span><span class="v" id="g-lvl">-</span></div>
            <div class="g-row"><span class="k">Members</span><span class="v" id="g-mem">-</span></div>
            <div class="g-row"><span class="k">Live XP</span><span class="v" id="g-xp">-</span></div>
            <div class="g-row"><span class="k">Gained XP</span><span class="v g-val-green" id="g-gained">-</span></div>
        </div>
    </div>

    <!-- LOGS -->
    <div class="panel" style="margin-bottom:0;">
        <div class="section-title" style="justify-content: space-between;">
            <div style="display:flex; align-items:center; gap:10px;"><span>Terminal Logs</span></div>
            <button class="btn-save" style="padding: 6px 12px; font-size: 0.7rem;" onclick="clearLogs()">Clear</button>
        </div>
        <div class="logs-box" id="logs-box">
            <div class="log-line log-info">Waiting for bot to start...</div>
        </div>
    </div>

</div>

<div id="toast-container"></div>

<script>
    const API = "";
    
    // ═══════════ SQUAD LOGIC ═══════════
    let squads = JSON.parse(localStorage.getItem('squadsData')) || [
        { guildId: "", slots: [{uid:"", pass:""}, {uid:"", pass:""}, {uid:"", pass:""}, {uid:"", pass:""}] },
        { guildId: "", slots: [{uid:"", pass:""}, {uid:"", pass:""}, {uid:"", pass:""}, {uid:"", pass:""}] }
    ];

    function renderSquads() {
        const container = document.getElementById('squads-container');
        container.innerHTML = "";

        squads.forEach((squad, i) => {
            const squadDiv = document.createElement('div');
            squadDiv.className = 'squad-card';
            
            let slotsHtml = "";
            squad.slots.forEach((slot, j) => {
                slotsHtml += `
                    <div class="slot-row">
                        <div class="slot-label">SLOT ${j + 1}</div>
                        <div class="slot-inputs">
                            <input type="text" placeholder="UID" value="${slot.uid}" onchange="updateSlot(${i}, ${j}, 'uid', this.value)">
                            <input type="password" placeholder="Password" value="${slot.pass}" onchange="updateSlot(${i}, ${j}, 'pass', this.value)">
                        </div>
                    </div>
                `;
            });

            squadDiv.innerHTML = `
                <div class="squad-header">
                    <div class="squad-title">
                        <div class="squad-badge">${i + 1}</div>
                        SQUAD ${i + 1}
                    </div>
                    ${squads.length > 1 ? `<button class="btn-remove" onclick="removeSquad(${i})">Remove</button>` : ''}
                </div>
                <div class="input-group">
                    <input type="text" placeholder="Guild ID for Squad ${i + 1}" value="${squad.guildId}" onchange="updateGuild(${i}, this.value)">
                    <button class="btn-save">Save</button>
                </div>
                ${slotsHtml}
            `;
            container.appendChild(squadDiv);
        });
    }

    function updateSlot(sIdx, slotIdx, key, val) {
        squads[sIdx].slots[slotIdx][key] = val;
        saveData();
    }

    function updateGuild(sIdx, val) {
        squads[sIdx].guildId = val;
        saveData();
    }

    function addSquad() {
        squads.push({ guildId: "", slots: [{uid:"", pass:""}, {uid:"", pass:""}, {uid:"", pass:""}, {uid:"", pass:""}] });
        saveData();
        renderSquads();
    }

    function removeSquad(index) {
        squads.splice(index, 1);
        saveData();
        renderSquads();
    }

    function saveData() {
        localStorage.setItem('squadsData', JSON.stringify(squads));
    }

    async function launchAll() {
        let accounts = [];
        squads.forEach(s => {
            s.slots.forEach(slot => {
                if(slot.uid && slot.pass) {
                    accounts.push({ uid: slot.uid, password: slot.pass });
                }
            });
        });

        if(accounts.length === 0) {
            toast("Please fill at least one UID and Password!", "error");
            return;
        }

        let successCount = 0;
        for(let acc of accounts) {
            try {
                let res = await fetch(API + '/api/account/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(acc)
                });
                if(res.ok) successCount++;
            } catch(e) { console.error(e); }
        }

        toast(`Successfully sent launch request for ${successCount} accounts!`, "success");
        
        squads.forEach(s => {
            s.slots.forEach(slot => { slot.uid = ""; slot.pass = ""; });
        });
        saveData();
        renderSquads();
        fetchStats();
    }

    // ═══════════ GUILD LOGIC ═══════════
    async function fetchGuild() {
        const id = document.getElementById('guildId').value.trim();
        const region = document.getElementById('guildRegion').value;
        const resBox = document.getElementById('guildResult');

        if(!id) { toast("Enter Guild ID", "error"); return; }
        
        resBox.classList.add('active');
        document.getElementById('g-name').innerText = "Fetching...";

        try {
            let res = await fetch(`${API}/api/guildinfo?guild_id=${id}&region=${region}&key=XEROX_MODS`);
            let data = await res.json();
            
            if(data.error) {
                document.getElementById('g-name').innerText = "Error: " + data.error;
                toast("Failed to fetch guild", "error");
                return;
            }

            let info = data.api_response.clan_basic_info;
            document.getElementById('g-name').innerText = info.clan_name || "Unknown";
            document.getElementById('g-id').innerText = info.clan_id;
            document.getElementById('g-lvl').innerText = info.clan_level;
            document.getElementById('g-mem').innerText = info.current_members + " / " + info.max_members;
            document.getElementById('g-xp').innerText = (info.Total_guild_xp || 0).toLocaleString();
            document.getElementById('g-gained').innerText = "+" + (info.gained_exp || 0).toLocaleString();
            toast("Guild data loaded", "success");
        } catch(e) {
            document.getElementById('g-name').innerText = "Network Error";
        }
    }

    // ═══════════ LIVE STATS & ACCOUNTS ═══════════
    async function fetchStats() {
        try {
            let res = await fetch(`${API}/api/stats`);
            let data = await res.json();
            
            // Stats Box Update
            document.getElementById('stat-acc').innerText = data.total_accounts || 0;
            document.getElementById('stat-match').innerText = data.total_matches || 0;
            document.getElementById('stat-exp').innerText = (data.total_gained_exp || 0).toLocaleString();
            document.getElementById('stat-exph').innerText = (data.exp_per_hour || 0).toLocaleString();
            
            document.getElementById('acc-count').innerText = `(${data.total_accounts || 0})`;

            // Accounts List Update
            const accList = document.getElementById('acc-list');
            if(data.accounts && data.accounts.length > 0) {
                accList.innerHTML = data.accounts.map(a => {
                    let statusClass = a.is_paused ? 'b-yellow' : (a.status === 'IN_MATCH' ? 'b-green' : 'b-green');
                    let statusText = a.is_paused ? 'PAUSED' : (a.status === 'IN_MATCH' ? '⚔ MATCHING' : '● ONLINE');
                    let btnClass = a.is_paused ? 'btn-resume' : 'btn-pause';
                    let btnText = a.is_paused ? '▶ RESUME' : '⏸ PAUSE';
                    
                    return `
                    <div class="acc-item">
                        <div class="acc-top">
                            <div class="acc-info">
                                <h4>${a.nickname} <span class="badge b-green">Lv ${a.level}</span></h4>
                                <p>UID: ${a.uid} | Region: ${a.region}</p>
                            </div>
                            <span class="badge ${statusClass}">${statusText}</span>
                        </div>
                        
                        <div class="acc-progress">
                            <div class="acc-progress-bar" style="width: ${a.progress_pct || 0}%"></div>
                        </div>
                        <div class="acc-exp-text">
                            <span>${a.progress_pct || 0}% to Lv ${a.next_level}</span>
                            <span>+${(a.gained_exp || 0).toLocaleString()} EXP</span>
                        </div>
                        
                        <div class="acc-actions">
                            <button class="btn-sm ${btnClass}" onclick="togglePause('${a.uid}')">${btnText}</button>
                            <button class="btn-sm btn-del" onclick="deleteAcc('${a.uid}')">🗑 DELETE</button>
                        </div>
                    </div>
                    `;
                }).join('');
            } else {
                accList.innerHTML = '<div style="text-align:center; color:var(--text-muted); font-size:0.85rem; padding:20px;">No accounts running yet.</div>';
            }

            // Logs Update
            if(data.logs && data.logs.length > 0) {
                const box = document.getElementById('logs-box');
                box.innerHTML = data.logs.map(l => {
                    let cls = `log-${l.level}`;
                    return `<div class="log-line ${cls}"><span class="log-time">[${l.time}]</span>${l.message}</div>`;
                }).join('');
                box.scrollTop = box.scrollHeight;
            }

        } catch(e) { console.error("Stats Error:", e); }
    }

    // ═══════════ ACTIONS ═══════════
    async function togglePause(uid) {
        try {
            await fetch(`${API}/api/account/pause`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({uid})
            });
            fetchStats();
        } catch(e) {}
    }

    async function deleteAcc(uid) {
        if(!confirm("Delete account " + uid + "?")) return;
        try {
            await fetch(`${API}/api/account/delete`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({uid})
            });
            fetchStats();
        } catch(e) {}
    }

    async function clearLogs() {
        try {
            await fetch(`${API}/api/logs/clear`, {
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'
            });
            document.getElementById('logs-box').innerHTML = '<div class="log-line log-info">Logs cleared.</div>';
            toast("Logs cleared", "success");
        } catch(e) {}
    }

    function toast(msg, type="info") {
        const container = document.getElementById('toast-container');
        const t = document.createElement('div');
        t.className = `toast ${type}`;
        t.textContent = msg;
        container.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    // INIT
    renderSquads();
    fetchStats();
    setInterval(fetchStats, 2500);
</script>
</body>
</html>
